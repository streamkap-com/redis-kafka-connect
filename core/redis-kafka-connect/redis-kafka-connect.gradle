dependencies {
    implementation group: 'com.redis', name: 'lettucemod', version: lettucemodVersion
    implementation group: 'com.redis', name: 'spring-batch-redis', version: springBatchRedisVersion
    implementation 'org.apache.commons:commons-pool2'
    implementation 'org.slf4j:slf4j-api'
    compileOnly 'org.apache.kafka:connect-api'
    compileOnly 'org.apache.kafka:connect-json'
    testImplementation 'org.apache.kafka:connect-api'
    testImplementation 'org.apache.kafka:connect-json'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.slf4j:slf4j-simple'
    testImplementation group: 'com.redis', name: 'spring-batch-redis', version: springBatchRedisVersion, classifier: 'tests'
    testImplementation group: 'org.testcontainers', name: 'junit-jupiter', version: testcontainersVersion
    testImplementation(group: 'com.redis.testcontainers', name: 'testcontainers-redis', version: testcontainersRedisVersion) {
        exclude group: 'com.redis', module: 'lettucemod'
    }
}

eclipse {
    project {
        name = 'redis-kafka-connect-core'
    }
}

import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

compileJava {
    options.release = 8
}

def archiveFilename = "redis-redis-kafka-connect"
def releaseDate = DateTimeFormatter.ISO_LOCAL_DATE.format(LocalDateTime.now())

tasks.register('copyRuntimeJars', Copy) {
    description = "Copies all runtime dependencies as individual JARs"
    group = "Packaging"
    from(configurations.runtimeClasspath)
    from(jar) {
        into("")
    }
    into("$buildDir/dependency-jars")
}

build.finalizedBy copyRuntimeJars
